<div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 transition-opacity">
  
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden animate-fade-in-up">
    
    <div class="bg-primary-50 px-6 py-4 border-b border-primary-100 flex justify-between items-center">
      <h2 class="text-xl font-bold text-primary-800 flex items-center gap-2">
        <span class="material-icons-round text-primary-500">{{ userToEdit ? 'edit' : 'person_add' }}</span>
        {{ userToEdit ? 'Editar Usuario' : 'Nuevo Usuario' }}
      </h2>
      <button (click)="cancel()" class="text-slate-400 hover:text-red-500 transition-colors">
        <span class="material-icons-round">close</span>
      </button>
    </div>

    <form [formGroup]="form" (ngSubmit)="save()" class="p-6 space-y-4">
      
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Nombre</label>
          <input type="text" formControlName="firstName" 
                 class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none transition-all"
                 [class.border-red-300]="form.get('firstName')?.invalid && form.get('firstName')?.touched">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Apellido</label>
          <input type="text" formControlName="lastName" 
                 class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none transition-all"
                 [class.border-red-300]="form.get('lastName')?.invalid && form.get('lastName')?.touched">
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Correo Electrónico</label>
        <input type="email" formControlName="email" placeholder="ejemplo@empresa.com"
               class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none transition-all"
               [class.border-red-300]="form.get('email')?.invalid && form.get('email')?.touched">
        <p *ngIf="form.get('email')?.hasError('email')" class="text-xs text-red-500 mt-1">Formato de correo inválido.</p>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Rol de Usuario</label>
          <select formControlName="roleId" 
                  class="w-full px-4 py-2 border rounded-lg bg-white focus:ring-2 focus:ring-primary-500 outline-none">
            <option [ngValue]="null" disabled>Selecciona un rol</option>
            <option *ngFor="let role of roles" [ngValue]="role.id">{{ role.name }}</option>
          </select>
        </div>
        
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">
            Contraseña
            <span *ngIf="userToEdit" class="text-xs font-normal text-slate-400">(Opcional)</span>
          </label>
          <input type="password" formControlName="password" 
                 class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary-500 outline-none"
                 [placeholder]="userToEdit ? 'Sin cambios' : '******'">
        </div>
      </div>

      <div class="flex items-center gap-2 mt-2">
        <input type="checkbox" id="isActive" formControlName="isActive" 
               class="w-5 h-5 text-primary-600 rounded focus:ring-primary-500 border-gray-300">
        <label for="isActive" class="text-sm text-slate-700">Usuario Activo</label>
      </div>

      <div *ngIf="errorMessage" class="mb-4 p-3 bg-red-50 border border-red-200 text-red-600 rounded-lg text-sm flex items-center gap-2 animate-pulse">
        <span class="material-icons-round text-base">error</span>
        {{ errorMessage }}
      </div>

      <div class="pt-4 flex justify-end gap-3 border-t border-slate-100 mt-4">
        <button type="button" (click)="cancel()" 
                class="px-4 py-2 text-slate-600 font-medium hover:bg-slate-100 rounded-lg transition-colors">
          Cancelar
        </button>
        <button type="submit" [disabled]="isSubmitting"
                class="px-6 py-2 bg-primary-500 hover:bg-primary-600 text-white font-medium rounded-lg shadow-lg shadow-orange-200 transition-all transform hover:-translate-y-0.5 disabled:opacity-50 disabled:cursor-not-allowed">
          {{ isSubmitting ? 'Guardando...' : 'Guardar Usuario' }}
        </button>
      </div>

    </form>
  </div>
</div>
