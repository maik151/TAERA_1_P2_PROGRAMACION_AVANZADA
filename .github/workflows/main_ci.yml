name: Full Stack Distributed CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  # --- JOB 1: BACKEND (ACTUALIZADO) ---
  build-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    - name: Restore dependencies
      run: dotnet restore ./REST_GestionUsuarios/REST_GestionUsuarios.sln
      
    - name: Build API
      # Especificamos Release explícitamente
      run: dotnet build ./REST_GestionUsuarios/REST_GestionUsuarios.sln --no-restore --configuration Release
      
    - name: Run Unit Tests
      # Eliminamos --no-build para que dotnet encuentre/genere los binarios correctamente en el entorno de Linux
      run: dotnet test ./REST_GestionUsuarios/REST_GestionUsuarios.sln --configuration Release --verbosity normal

  # --- JOB 2: FRONTEND (SE MANTIENE IGUAL) ---
  build-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install Dependencies
      working-directory: ./UseManagment.UI
      run: npm ci --legacy-peer-deps

    - name: Build Angular App
      working-directory: ./UseManagment.UI
      run: npm run build -- --configuration production

    - name: Docker Build (Frontend)
      run: docker build ./UseManagment.UI -t mi-app-frontend:latest