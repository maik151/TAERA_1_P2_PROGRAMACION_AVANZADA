name: Full Stack Distributed CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  # --- JOB 1: BACKEND ---
  build-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    - name: Restore dependencies
      # CORRECCIÓN: Usamos el nombre real de tu solución y la carpeta contenedora
      run: dotnet restore ./Taller_REST_API/Taller_REST_API.sln
      
    - name: Build API
      run: dotnet build ./Taller_REST_API/Taller_REST_API.sln --no-restore --configuration Release
      
    - name: Run Unit Tests
      run: dotnet test ./Taller_REST_API/Taller_REST_API.sln --no-build --verbosity normal
      
    - name: Docker Build (Backend)
      # CORRECCIÓN: Apuntamos al archivo DockerFile (con F mayúscula) dentro de la carpeta
      run: docker build . -f ./Taller_REST_API/DockerFile -t mi-app-backend:latest

  # --- JOB 2: FRONTEND ---
  build-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install Dependencies
      # CORRECCIÓN: Respetamos las mayúsculas exactas "UseManagment.UI"
      working-directory: ./UseManagment.UI
      run: npm ci --legacy-peer-deps

    - name: Build Angular App
      working-directory: ./UseManagment.UI
      run: npm run build -- --configuration production

    - name: Docker Build (Frontend)
      run: docker build . -f ./UseManagment.UI/Dockerfile -t mi-app-frontend:latest