name: Full Stack Distributed CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  # --- JOB 1: BACKEND ---
  build-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    - name: Restore dependencies
      # Restauramos apuntando al archivo SLN específico
      run: dotnet restore ./Taller_REST_API/Taller_REST_API.sln
      
    - name: Build API
      run: dotnet build ./Taller_REST_API/Taller_REST_API.sln --no-restore --configuration Release
      
    - name: Run Unit Tests
      run: dotnet test ./Taller_REST_API/Taller_REST_API.sln --no-build --verbosity normal
      
    - name: Docker Build (Backend)
      # CORRECCIÓN CRÍTICA:
      # 1. El contexto de construcción es './Taller_REST_API' (la carpeta del proyecto)
      # 2. Apuntamos al archivo DockerFile específico (respetando la F mayúscula)
      run: docker build ./Taller_REST_API -f ./Taller_REST_API/DockerFile -t mi-app-backend:latest

  # --- JOB 2: FRONTEND ---
  build-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install Dependencies
      working-directory: ./UseManagment.UI
      run: npm ci --legacy-peer-deps

    - name: Build Angular App
      working-directory: ./UseManagment.UI
      run: npm run build -- --configuration production

    - name: Docker Build (Frontend)
      # CORRECCIÓN CRÍTICA:
      # El contexto es './UseManagment.UI'. Docker buscará el package.json AHÍ dentro.
      run: docker build ./UseManagment.UI -t mi-app-frontend:latest